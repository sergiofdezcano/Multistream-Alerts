<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Serg4Cano MultiGoal — Demo</title>
<style>:root{font-family:Inter,Segoe UI,Arial,sans-serif;background:#0c1119;color:#eef2f7}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:800px;margin:auto}h1{font-size:26px}p{color:#a4b0bf;line-height:1.6}.panel{background:#16202e;border:1px solid #293647;border-radius:16px;padding:20px;margin:20px 0}.scene{min-height:220px;border-radius:12px;background:radial-gradient(ellipse at 65% 60%,#46566b,#142232 65%,#0b1420);display:flex;justify-content:center;align-items:flex-end;padding:25px}.scene.light{background:#eef0f4}.scene iframe{width:440px;max-width:100%;height:55px;border:0;background:transparent}button,select,input{border:1px solid #445065;background:#223348;color:white;border-radius:8px;padding:10px 14px;font:inherit}button{cursor:pointer}button:hover{background:#364960}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}label{display:block;color:#aab7c7;font-size:12px;margin-bottom:6px}select{max-width:100%;width:300px}input{width:95px}a{color:#b7d6ff}</style></head><body>
<main><small>SERG4CANO / OBS OVERLAY</small><h1>MultiGoal — Demo interactiva</h1><p>Un solo objetivo visible a la vez. Rota automáticamente, sin adornos y con fondo transparente para OBS.</p>
<div class="panel"><div class="scene" id="scene"><iframe id="preview" src="index.html?demo=1" title="Vista previa"></iframe></div><div class="row"><button id="prev">← Anterior</button><button id="next">Siguiente →</button><button id="background">Cambiar fondo</button></div></div>
<div class="panel"><h2>Simular eventos</h2><p>Estos cambios solo modifican la demo, no afectan a tus cuentas ni a Streamer.bot.</p>
<div class="row"><div><label for="goal">Objetivo</label><select id="goal"></select></div><div><label for="amount">Cantidad</label><input id="amount" type="number" min="1" value="1"></div></div>
<div class="row"><button id="increase">Simular +</button><button id="decrease">Simular −</button><button id="reset">Restablecer valores</button></div><p>Widget para OBS: <a href="index.html">index.html</a>.</p></div></main>
<script src="config.js"></script><script src="demo.js"></script></body></html>
